name: Protocol Contract Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: protocol-contracts-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate schemas and governance contracts
        run: node scripts/validate-contracts.mjs
